name: SLA Alert

on:
  schedule:
    - cron: "*/30 7-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sla:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run SLA alerting
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python check_sla.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push state if changed
        run: |
          if ! git diff --quiet sla_state.json; then
            git add sla_state.json
            git commit -m "chore: update sla_state.json [skip ci]"
            git push
          else
            echo "No state changes to push."
          fi
